name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/pint --test src/ tests/
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} ${{ matrix.dependencies == 'lowest' && '(lowest)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
          - php: '8.4'
            laravel: '13'
            testbench: '11'
            coverage: true
          - php: '8.3'
            laravel: '12'
            testbench: '10'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - name: Require Laravel ${{ matrix.laravel }}
        run: composer require --no-update --dev "illuminate/support:^${{ matrix.laravel }}.0" "illuminate/database:^${{ matrix.laravel }}.0" "illuminate/console:^${{ matrix.laravel }}.0" "illuminate/filesystem:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0"

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies || 'highest' }}

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: vendor/bin/pest --compact

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/pest --coverage --min=100

  databases:
    runs-on: ubuntu-latest
    name: MySQL, MariaDB and PostgreSQL
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: testing
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none
      - uses: ramsey/composer-install@v4

      - name: MySQL
        run: vendor/bin/pest --compact
        env:
          DB_CONNECTION: mysql
          DB_PORT: 3306

      - name: MariaDB
        run: vendor/bin/pest --compact
        env:
          DB_CONNECTION: mariadb
          DB_PORT: 3307

      - name: PostgreSQL
        run: vendor/bin/pest --compact
        env:
          DB_CONNECTION: pgsql
          DB_PORT: 5432
